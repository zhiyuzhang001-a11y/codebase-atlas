name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Expose Node to integration tests
        run: python -c "import os,shutil; open(os.environ['GITHUB_ENV'], 'a').write('ATLAS_NODE=' + shutil.which('node') + '\n')"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: codebase-atlas --version
      - run: python scripts/verify_release.py

  package-lifecycle:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip wheel . --no-deps --wheel-dir dist-current
      - run: python scripts/verify_release.py --wheel dist-current/codebase_atlas-*.whl
      - run: python scripts/check_publication_readiness.py --mode pre-public
      - run: python scripts/build_previous_wheel.py --current v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])") --output dist-previous
      - run: python scripts/lifecycle_acceptance.py --previous-wheel dist-previous/codebase_atlas-*.whl --current-wheel dist-current/codebase_atlas-*.whl
