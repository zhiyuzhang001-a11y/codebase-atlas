name: Private release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/verify_release.py --tag "${GITHUB_REF_NAME}" --wheel dist/codebase_atlas-*.whl
      - name: Write checksum
        run: sha256sum dist/codebase_atlas-*.whl > dist/SHA256SUMS.txt
      - name: Create private-repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
