[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-atlas"
version = "0.9.0"
description = "Local, explainable code intelligence with provider-neutral provenance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codebase-atlas = "codebase_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/codebase-atlas" = ["scripts/serena_runner.py", "scripts/ts_test_analyzer.mjs"]
"share/codebase-atlas/node_modules/typescript" = ["node_modules/typescript/package.json", "node_modules/typescript/LICENSE.txt"]
"share/codebase-atlas/node_modules/typescript/lib" = ["node_modules/typescript/lib/typescript.js"]
