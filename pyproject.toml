[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-atlas"
version = "0.25.0"
description = "Local, explainable code intelligence with provider-neutral provenance"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.urls]
Repository = "https://github.com/zhiyuzhang001-a11y/codebase-atlas"
Documentation = "https://github.com/zhiyuzhang001-a11y/codebase-atlas/tree/main/docs"
Changelog = "https://github.com/zhiyuzhang001-a11y/codebase-atlas/blob/main/CHANGELOG.md"
Issues = "https://github.com/zhiyuzhang001-a11y/codebase-atlas/issues"

[project.scripts]
codebase-atlas = "codebase_atlas.cli:main"
atlas = "codebase_atlas.simple_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codebase_atlas.ui_assets" = ["*.html", "*.css", "*.js"]

[tool.setuptools.data-files]
"share/codebase-atlas" = ["scripts/serena_runner.py", "scripts/ts_test_analyzer.mjs"]
"share/codebase-atlas/node_modules/typescript" = ["vendor/typescript/package.json", "vendor/typescript/LICENSE.txt"]
"share/codebase-atlas/node_modules/typescript/lib" = ["vendor/typescript/lib/typescript.js"]
