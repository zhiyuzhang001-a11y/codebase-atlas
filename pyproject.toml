[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-atlas"
version = "0.2.0"
description = "Local, explainable code intelligence with provider-neutral provenance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codebase-atlas = "codebase_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/codebase-atlas" = ["scripts/serena_runner.py", "scripts/ts_test_analyzer.mjs"]
